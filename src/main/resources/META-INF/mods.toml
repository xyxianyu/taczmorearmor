modLoader="javafml"
loaderVersion="${loader_version_range}"
license="CC-BY-NC-SA-4.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="诚挚感谢 TaCZ（永恒枪械工坊：零）原作者 起重基喵 及其团队提供的基础框架支持！"
description='''
本模组可与 TaCZ (永恒枪械工坊：零) 联动；未安装 TaCZ 时也可单独运行，为 TACZ 添加更多种类的防弹衣、材料与修理系统，并对不同枪械提供部位减伤。
本模组为 TACZ 第三方扩展，诚挚感谢原作者 起重基喵 及其团队提供的基础框架支持，由此向 TACZ 原作者团队致谢！
本作品遵循 CC BY-NC-SA 4.0 协议，允许非商业二次创作，但需标明出处。
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
mandatory=false
versionRange="[1.1.8,)"
ordering="NONE"
side="BOTH"